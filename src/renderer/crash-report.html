<!DOCTYPE html>
<!-- Janela "O jogo fechou com um erro" (src/main/crash-report.js). Os textos vêm do processo
     principal (i18n.js, chaves crash.*). Nada é enviado sem o clique em "Enviar". -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'">
<title>AsgardMU</title>
<style>
  @font-face { font-family: 'Barlow Condensed'; font-weight: 700; src: url('assets/fonts/barlow-condensed-700.woff2') format('woff2'); }
  @font-face { font-family: 'PT Sans'; font-weight: 400; src: url('assets/fonts/pt-sans-400.woff2') format('woff2'); }
  @font-face { font-family: 'PT Sans'; font-weight: 700; src: url('assets/fonts/pt-sans-700.woff2') format('woff2'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { color-scheme: dark; }
  html, body { height: 100%; }
  body {
    font-family: 'PT Sans', 'Segoe UI', sans-serif;
    font-size: 13px;
    color: #f5f5f7;
    background: radial-gradient(ellipse at top, #191D3B 0%, #070815 70%);
    border: 1px solid rgba(230, 179, 37, 0.45);
    user-select: none;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    -webkit-app-region: drag;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px 10px;
    border-bottom: 1px solid rgba(71, 76, 119, 0.75);
  }
  header img { width: 26px; height: 26px; }
  h1 {
    font-family: 'Barlow Condensed', 'Segoe UI', sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #e8c45a;
  }
  main { flex: 1; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
  .message { color: #C8CCDE; line-height: 1.45; }
  .details { color: #787DA2; font-size: 12px; line-height: 1.4; }
  .meta { color: #9DA2C0; font-size: 12px; }
  label { color: #9DA2C0; font-size: 12px; }
  textarea {
    width: 100%;
    height: 74px;
    resize: none;
    padding: 8px;
    font: inherit;
    color: #f5f5f7;
    background: #0C0E20;
    border: 1px solid #2C3158;
    outline: none;
    user-select: text;
  }
  textarea:focus { border-color: #ce9a12; }
  .status { min-height: 18px; font-size: 12px; }
  .status.ok { color: #34D399; }
  .status.error { color: #F87171; }
  footer { display: flex; justify-content: flex-end; gap: 10px; padding: 0 18px 16px; }
  button {
    font-family: 'Barlow Condensed', 'Segoe UI', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 8px 18px;
    cursor: pointer;
    border: 1px solid #474C77;
    background: #12152C;
    color: #C8CCDE;
    clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
  }
  button:hover:not(:disabled) { background: #191D3B; color: #fff; }
  button.primary { background: linear-gradient(180deg, #f2c744, #ce9a12); color: #070815; border-color: #e6b325; }
  button.primary:hover:not(:disabled) { background: linear-gradient(180deg, #f7ecc3, #e6b325); color: #070815; }
  button:disabled { opacity: 0.5; cursor: default; }
  button:focus-visible { outline: 2px solid #f0da8e; outline-offset: -4px; }
</style>
</head>
<body>
  <header>
    <img src="assets/logo.png" alt="">
    <h1 id="title"></h1>
  </header>
  <main>
    <p class="message" id="message"></p>
    <p class="meta" id="meta"></p>
    <label for="comment" id="commentLabel"></label>
    <textarea id="comment" maxlength="1000"></textarea>
    <p class="details" id="details"></p>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>
  <footer>
    <button type="button" id="dontSend"></button>
    <button type="button" id="send" class="primary"></button>
  </footer>
<script>
  const { ipcRenderer } = require('electron');
  const $ = id => document.getElementById(id);
  let texts = {};
  let sent = false;

  function setStatus(text, kind) {
    const el = $('status');
    el.textContent = text || '';
    el.className = 'status' + (kind ? ' ' + kind : '');
  }

  async function init() {
    const view = await ipcRenderer.invoke('crash-report:get');
    if (!view) { window.close(); return; }
    texts = view.texts;
    document.documentElement.lang = { Por: 'pt-BR', Spa: 'es', Eng: 'en' }[view.language] || 'en';
    document.title = texts.title;
    $('title').textContent = texts.title;
    $('message').textContent = texts.message;
    $('details').textContent = texts.details;
    $('commentLabel').textContent = texts.commentLabel;
    $('comment').placeholder = texts.commentPlaceholder;
    $('send').textContent = texts.send;
    $('dontSend').textContent = texts.dontSend;

    const when = view.crashedAt ? new Date(view.crashedAt).toLocaleString(document.documentElement.lang) : '';
    $('meta').textContent = [view.character, when].filter(Boolean).join(' · ');
    $('send').focus();
  }

  $('dontSend').addEventListener('click', () => ipcRenderer.invoke('crash-report:close'));

  $('send').addEventListener('click', async () => {
    if (sent) { ipcRenderer.invoke('crash-report:close'); return; }
    $('send').disabled = true;
    $('dontSend').disabled = true;
    $('comment').disabled = true;
    setStatus(texts.sending);
    const result = await ipcRenderer.invoke('crash-report:send', { comment: $('comment').value.trim() });
    if (result && result.ok) {
      sent = true;
      setStatus(texts.sent, 'ok');
      $('send').textContent = texts.close;
      $('send').disabled = false;
      $('dontSend').style.display = 'none';
      setTimeout(() => ipcRenderer.invoke('crash-report:close'), 4000);
    } else {
      // Pode tentar de novo: o mesmo relatório não é gravado duas vezes no site.
      setStatus(texts.failed, 'error');
      $('send').disabled = false;
      $('dontSend').disabled = false;
      $('comment').disabled = false;
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !$('dontSend').disabled) ipcRenderer.invoke('crash-report:close');
  });

  init();
</script>
</body>
</html>
