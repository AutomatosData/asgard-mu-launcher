<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="">
    <title>Asgard MU</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/components.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Configuração centralizada de URLs -->
    <script src="../shared/url-config.js"></script>
    <script src="../shared/i18n.js"></script>
</head>
<body>
    <!-- Title Bar -->
    <div class="title-bar">
        <div class="title-bar-left">
            <img src="assets/icon.ico" alt="AsgardMU" class="logo">
            <span class="title">Asgard MU</span>
        </div>
        
        <div class="title-bar-right">
            <button class="title-bar-btn" id="settingsBtn" title="Settings" data-i18n-title="titlebar.settings">
                <i class="fas fa-cog"></i>
            </button>
            <button class="title-bar-btn" id="minimizeBtn">
                <i class="fas fa-window-minimize"></i>
            </button>
            <button class="title-bar-btn" id="closeBtn">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-container">
        <!-- Content Area -->
        <div class="content-area">
            <!-- Web Content (new/Info) -->
            <div class="web-content" id="webContent">
                <!-- Loader Principal -->
                <div class="main-loader" id="mainLoader">
                    <div class="loader-container">
                        <i class="fas fa-spinner fa-spin"></i>
                        <div class="loader-text">
                            <h3 data-i18n="loading">Loading...</h3>
                        </div>
                    </div>
                </div>
                
                <!-- Loader Secundário (para webview) -->
                <div class="loading-spinner" id="webLoading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <span data-i18n="loading">Loading...</span>
                </div>
                
                <!-- Estado de erro -->
                <div class="loading-error-state" id="webError" style="display: none;">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span data-i18n="web.error">Failed to load content</span>
                </div>
                <webview id="newWebview" src="about:blank" nodeintegration websecurity="false" allowpopups disablewebsecurity preload="./scripts/webview-preload.js"></webview>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-left">
                <!-- Botão de configurações removido - launcher funciona automaticamente -->
            </div>
            
            <div class="footer-center">
                <!-- Update Progress no Footer -->
                <div class="update-progress-footer" id="updateProgressFooter">
                    <div class="progress-row">
                        <span class="progress-label" data-i18n="footer.download">Download:</span>
                        <div class="progress-bar-footer">
                            <div class="progress-fill-footer" id="downloadProgressFooter"></div>
                        </div>
                        <span class="progress-text-footer" id="downloadTextFooter">0%</span>
                    </div>
                    <div class="progress-row">
                        <span class="progress-label" data-i18n="footer.overall">Overall:</span>
                        <div class="progress-bar-footer">
                            <div class="progress-fill-footer" id="overallProgressFooter"></div>
                        </div>
                        <span class="progress-text-footer" id="overallTextFooter">0%</span>
                    </div>
                    <div class="current-file-info" id="currentFileInfo">
                        <span class="status-text">Initializing launcher...</span>
                        <div class="account-counter" id="accountCounter">
                            <span class="counter-text" data-i18n="footer.accounts">Connected Accounts</span>
                            <span class="counter-value" id="connectedAccounts">0</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="footer-right">
                <button class="btn btn-primary" id="playBtn" disabled>
                    <i class="fas fa-play"></i>
                    <span data-i18n="play">Play Game</span>
                </button>
            </div>
        </footer>
    </div>

        <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content settings-modal">
            <div class="modal-header">
                <h3><i class="fas fa-cog"></i> <span data-i18n="settings.title">Game Settings</span></h3>
                <button class="modal-close" id="closeSettings">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="modal-body">
                <div class="settings-tabs">
                    <button class="tab-btn active" data-tab="display">
                        <i class="fas fa-desktop"></i>
                        <span data-i18n="settings.tabGame">Game</span>
                    </button>
                    <button class="tab-btn" data-tab="language">
                        <i class="fas fa-globe"></i>
                        <span data-i18n="settings.tabAccount">Account</span>
                    </button>
                </div>

                <div class="settings-content">
                    <!-- Display Tab -->
                    <div class="tab-content active" id="display-tab">
                        <div class="setting-group">
                            <h3 data-i18n="settings.displayMode">Display Mode</h3>
                            <div class="radio-group">
                                <label class="radio-option">
                                    <input type="radio" name="displayMode" value="window" checked>
                                    <span class="radio-custom"></span>
                                    <span class="radio-label" data-i18n="settings.window">Window Mode</span>
                                </label>
                                <label class="radio-option">
                                    <input type="radio" name="displayMode" value="fullscreen">
                                    <span class="radio-custom"></span>
                                    <span class="radio-label" data-i18n="settings.fullscreen">Fullscreen Mode</span>
                                </label>
                            </div>
                        </div>

                        <div class="setting-group">
                            <h3 data-i18n="settings.resolution">Resolution</h3>
                            <select class="resolution-dropdown" id="resolutionSelect">
                                <option value="800x600">800x600</option>
                                <option value="1024x768">1024x768</option>
                                <option value="1150x900">1150x900</option>
                                <option value="1280x768" selected>1280x768 (Wide)</option>
                                <option value="1280x1024">1280x1024</option>
                                <option value="1440x900">1440x900 (Wide)</option>
                                <option value="1600x900">1600x900 (Wide)</option>
                                <option value="1680x1050">1680x1050 (Wide)</option>
                                <option value="1680x1080">1680x1080 (Wide)</option>
                                <option value="1600x1200">1600x1200 (Wide)</option>
                                <option value="1920x1080">1920x1080 (Wide)</option>
                                <option value="1920x1200">1920x1200 (Wide)</option>
                                <option value="1920x1440">1920x1440 (Wide)</option>
                                <option value="2560x1440">2560x1440 (Wide)</option>
                                <option value="MAX">MAX</option>
                            </select>
                        </div>

                        <div class="setting-group">
                            <h3 data-i18n="settings.audio">Audio Settings</h3>
                            <div class="checkbox-group">
                                <label class="checkbox-option">
                                    <input type="checkbox" id="musicEnabled">
                                    <span class="checkbox-custom"></span>
                                    <span class="checkbox-label" data-i18n="settings.music">Enable Music</span>
                                </label>
                                <label class="checkbox-option">
                                    <input type="checkbox" id="soundEnabled">
                                    <span class="checkbox-custom"></span>
                                    <span class="checkbox-label" data-i18n="settings.sound">Enable Sound Effects</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Language Tab -->
                    <div class="tab-content" id="language-tab">
                        <div class="setting-group">
                            <h3 data-i18n="settings.account">Account</h3>
                            <input type="text" id="accountId" maxlength="10" placeholder="Enter account ID (max 10 chars)" data-i18n-placeholder="settings.accountPlaceholder">
                        </div>
                        <div class="setting-group">
                            <h3 data-i18n="settings.language">Language</h3>
                            <div class="language-options">
                                <label class="language-option">
                                    <input type="radio" name="language" value="Eng" checked>
                                    <span class="language-custom">🇺🇸 English</span>
                                </label>
                                <label class="language-option">
                                    <input type="radio" name="language" value="Por">
                                    <span class="language-custom">🇧🇷 Português</span>
                                </label>
                                <label class="language-option">
                                    <input type="radio" name="language" value="Spa">
                                    <span class="language-custom">🇪🇸 Español</span>
                                </label>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
            
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelSettings" data-i18n="settings.cancel">Cancel</button>
                <button class="btn btn-primary" id="saveSettings" data-i18n="settings.save">Save Settings</button>
            </div>
        </div>
    </div>

    <!-- Notification Container -->
    <div class="notification-container" id="notificationContainer"></div>
    

    <!-- Data Installation Progress Modal -->
    <div class="modal" id="dataInstallationModal">
        <div class="modal-content data-installation-modal">
            <div class="modal-header">
                <h3><i class="fas fa-download"></i> <span data-i18n="install.title">Installing Game Data</span></h3>
            </div>
            
            <div class="modal-body">
                <div class="installation-content-compact">
                    <!-- Download Progress -->
                    <div class="progress-section-compact" id="downloadProgressSection">
                        <div class="progress-label-row-compact">
                            <span class="progress-label-compact" data-i18n="footer.download">Download:</span>
                            <span class="progress-percentage-compact" id="downloadProgressPercentage">0%</span>
                        </div>
                        <div class="progress-bar-container-compact">
                            <div class="progress-bar-compact">
                                <div class="progress-fill-compact" id="downloadProgressFill"></div>
                            </div>
                        </div>
                        <div class="progress-details-compact" id="downloadProgressDetails">
                            <span class="download-speed-compact" id="downloadSpeed">0 MB/s</span>
                        </div>
                    </div>
                    
                    <!-- Overall Progress -->
                    <div class="progress-section-compact">
                        <div class="progress-label-row-compact">
                            <span class="progress-label-compact" data-i18n="install.overall">Overall Progress:</span>
                            <span class="progress-percentage-compact" id="overallProgressPercentage">0%</span>
                        </div>
                        <div class="progress-bar-container-compact">
                            <div class="progress-bar-compact overall-progress-bar-compact">
                                <div class="progress-fill-compact" id="overallProgressFill"></div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Current Status -->
                    <div class="current-status-compact" id="currentStatus">
                        <i class="fas fa-info-circle"></i>
                        <span id="currentStatusText">Initializing...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="scripts/i18n.js"></script>
    <script src="scripts/app.js"></script>
    <script src="scripts/settings.js"></script>
    <script src="scripts/game-settings.js"></script>
</body>
</html>
