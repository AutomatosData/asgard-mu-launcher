<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AsgardMU</title>
    <link rel="stylesheet" href="styles/main.css">

    <!-- Configuração centralizada de URLs -->
    <script src="shared/url-config.js"></script>
    <script src="shared/i18n.js"></script>
</head>
<body>
    <!-- Ícones (traço no estilo lucide, igual ao site). Uso: <svg class="icon"><use href="#i-x"/></svg> -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
        <defs>
            <symbol id="i-settings" viewBox="0 0 24 24"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></symbol>
            <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
            <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
            <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a.8.8 0 0 0 1.2.7l12-7.5a.8.8 0 0 0 0-1.4l-12-7.5A.8.8 0 0 0 7 4.5Z" fill="currentColor"/></symbol>
            <symbol id="i-monitor" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></symbol>
            <symbol id="i-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
            <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
            <!-- Runa do status (StatusRune do site): círculo + runa Algiz -->
            <symbol id="i-rune" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" stroke-width="2.5"/><path d="M20 8v24M20 17l-7-7M20 17l7-7" stroke-width="3"/></symbol>
            <symbol id="i-rune-spin" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" stroke-width="2.5" stroke-dasharray="6 5"/><path d="M20 8v24M20 17l-7-7M20 17l7-7" stroke-width="3"/></symbol>
        </defs>
    </svg>

    <!-- Title Bar (data-tauri-drag-region: arrastar a janela por aqui) -->
    <div class="title-bar" data-tauri-drag-region>
        <div class="title-bar-left" data-tauri-drag-region>
            <img src="assets/logo.png" alt="AsgardMU" class="logo" data-tauri-drag-region>
            <span class="title-divider" aria-hidden="true" data-tauri-drag-region></span>
            <span class="title" data-tauri-drag-region>AsgardMU</span>
        </div>

        <div class="title-bar-right">
            <button class="title-bar-btn" id="settingsBtn" title="Settings" data-i18n-title="titlebar.settings">
                <svg class="icon"><use href="#i-settings"/></svg>
            </button>
            <button class="title-bar-btn" id="minimizeBtn" aria-label="Minimize">
                <svg class="icon"><use href="#i-minus"/></svg>
            </button>
            <button class="title-bar-btn title-bar-close" id="closeBtn" aria-label="Close">
                <svg class="icon"><use href="#i-x"/></svg>
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-container">
        <!-- Content Area -->
        <div class="content-area">
            <!-- Web Content (new/Info) -->
            <div class="web-content" id="webContent">
                <!-- Loader Principal -->
                <div class="main-loader" id="mainLoader">
                    <div class="loader-container">
                        <svg class="rune-spinner"><use href="#i-rune-spin"/></svg>
                        <div class="loader-text">
                            <h3 data-i18n="loading">Loading...</h3>
                        </div>
                    </div>
                </div>

                <!-- Loader Secundário (site carregando) -->
                <div class="loading-spinner" id="webLoading">
                    <svg class="rune-spinner"><use href="#i-rune-spin"/></svg>
                    <span data-i18n="loading">Loading...</span>
                </div>

                <!-- Estado de erro -->
                <div class="loading-error-state" id="webError" style="display: none;">
                    <svg class="icon"><use href="#i-alert"/></svg>
                    <span data-i18n="web.error">Failed to load content</span>
                </div>
                <!-- O site (asgardmu.com.br/new) abre aqui em um webview do launcher: site_load em src-tauri/src/main.rs -->
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer" data-tauri-drag-region>
            <div class="footer-center">
                <!-- Update Progress no Footer -->
                <div class="update-progress-footer" id="updateProgressFooter">
                    <div class="progress-row">
                        <span class="progress-label" data-i18n="footer.download">Download:</span>
                        <div class="progress-bar-footer">
                            <div class="progress-fill-footer" id="downloadProgressFooter"></div>
                        </div>
                        <span class="progress-text-footer" id="downloadTextFooter">0%</span>
                    </div>
                    <div class="progress-row">
                        <span class="progress-label" data-i18n="footer.overall">Overall:</span>
                        <div class="progress-bar-footer">
                            <div class="progress-fill-footer" id="overallProgressFooter"></div>
                        </div>
                        <span class="progress-text-footer" id="overallTextFooter">0%</span>
                    </div>
                    <div class="current-file-info" id="currentFileInfo">
                        <span class="status-text">Initializing launcher...</span>
                        <div class="account-counter" id="accountCounter">
                            <svg class="counter-rune"><use href="#i-rune"/></svg>
                            <span class="counter-text" data-i18n="footer.accounts">Connected Accounts</span>
                            <span class="counter-value" id="connectedAccounts">0</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="footer-right">
                <button class="btn btn-primary" id="playBtn" disabled>
                    <svg class="icon"><use href="#i-play"/></svg>
                    <span data-i18n="play">Play Game</span>
                </button>
            </div>
        </footer>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content settings-modal">
            <div class="modal-header">
                <h3><svg class="icon"><use href="#i-settings"/></svg> <span data-i18n="settings.title">Game Settings</span></h3>
                <button class="modal-close" id="closeSettings" aria-label="Close">
                    <svg class="icon"><use href="#i-x"/></svg>
                </button>
            </div>

            <div class="modal-body">
                <div class="settings-tabs">
                    <button class="tab-btn active" data-tab="display">
                        <svg class="icon"><use href="#i-monitor"/></svg>
                        <span data-i18n="settings.tabGame">Game</span>
                    </button>
                    <button class="tab-btn" data-tab="language">
                        <svg class="icon"><use href="#i-user"/></svg>
                        <span data-i18n="settings.tabAccount">Account</span>
                    </button>
                </div>

                <div class="settings-content">
                    <!-- Display Tab -->
                    <div class="tab-content active" id="display-tab">
                        <div class="setting-group">
                            <h3 data-i18n="settings.displayMode">Display Mode</h3>
                            <div class="radio-group">
                                <label class="radio-option">
                                    <input type="radio" name="displayMode" value="window" checked>
                                    <span class="radio-custom"></span>
                                    <span class="radio-label" data-i18n="settings.window">Window Mode</span>
                                </label>
                                <label class="radio-option">
                                    <input type="radio" name="displayMode" value="fullscreen">
                                    <span class="radio-custom"></span>
                                    <span class="radio-label" data-i18n="settings.fullscreen">Fullscreen Mode</span>
                                </label>
                            </div>
                        </div>

                        <div class="setting-group">
                            <h3 data-i18n="settings.aspectRatio">Aspect Ratio</h3>
                            <div class="radio-group ratio-group">
                                <label class="radio-option">
                                    <input type="radio" name="aspectRatio" value="4:3">
                                    <span class="radio-custom"></span>
                                    <span class="radio-label">4:3</span>
                                </label>
                                <label class="radio-option">
                                    <input type="radio" name="aspectRatio" value="16:9" checked>
                                    <span class="radio-custom"></span>
                                    <span class="radio-label">16:9</span>
                                </label>
                                <label class="radio-option">
                                    <input type="radio" name="aspectRatio" value="16:10">
                                    <span class="radio-custom"></span>
                                    <span class="radio-label">16:10</span>
                                </label>
                            </div>
                        </div>

                        <div class="setting-group">
                            <h3 data-i18n="settings.resolution">Resolution</h3>
                            <!-- Opções montadas por game-settings.js a partir dos modos do monitor -->
                            <select class="resolution-dropdown" id="resolutionSelect"></select>
                        </div>

                        <div class="setting-group">
                            <h3 data-i18n="settings.audio">Audio Settings</h3>
                            <div class="checkbox-group">
                                <label class="checkbox-option">
                                    <input type="checkbox" id="musicEnabled">
                                    <span class="checkbox-custom"></span>
                                    <span class="checkbox-label" data-i18n="settings.music">Enable Music</span>
                                </label>
                                <label class="checkbox-option">
                                    <input type="checkbox" id="soundEnabled">
                                    <span class="checkbox-custom"></span>
                                    <span class="checkbox-label" data-i18n="settings.sound">Enable Sound Effects</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Language Tab -->
                    <div class="tab-content" id="language-tab">
                        <div class="setting-group">
                            <h3 data-i18n="settings.account">Account</h3>
                            <input type="text" id="accountId" maxlength="10" placeholder="Enter account ID (max 10 chars)" data-i18n-placeholder="settings.accountPlaceholder">
                        </div>
                        <div class="setting-group">
                            <h3 data-i18n="settings.language">Language</h3>
                            <!-- Sigla em vez de bandeira: o Windows não desenha emojis de bandeira -->
                            <div class="language-options">
                                <label class="language-option">
                                    <input type="radio" name="language" value="Eng" checked>
                                    <span class="language-custom"><span class="language-code">EN</span>English</span>
                                </label>
                                <label class="language-option">
                                    <input type="radio" name="language" value="Por">
                                    <span class="language-custom"><span class="language-code">PT</span>Português</span>
                                </label>
                                <label class="language-option">
                                    <input type="radio" name="language" value="Spa">
                                    <span class="language-custom"><span class="language-code">ES</span>Español</span>
                                </label>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelSettings" data-i18n="settings.cancel">Cancel</button>
                <button class="btn btn-primary" id="saveSettings" data-i18n="settings.save">Save Settings</button>
            </div>
        </div>
    </div>

    <!-- Notification Container -->
    <div class="notification-container" id="notificationContainer"></div>


    <!-- Scripts -->
    <script src="scripts/bridge.js"></script>
    <script src="scripts/i18n.js"></script>
    <script src="scripts/app.js"></script>
    <script src="scripts/settings.js"></script>
    <script src="scripts/game-settings.js"></script>
</body>
</html>
